<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scroll Snap Test</title>
  <style>
    :root {
      --green-moss: #4b6043;
      --blush-pink: #d6a7a1;
      --warm-brown: #6b4e3d;
      --soft-beige: #f5f0e6;
      --text-dark:  #2e2a27;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory; /* aqui é o “encaixe” */
      font-family: system-ui, sans-serif;
    }

    header.navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 10px 20px;
      background: rgba(245, 240, 230, 0.9);
      display: flex;
      justify-content: flex-end;
      gap: 20px;
      z-index: 10;
    }

    header.navbar a {
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 600;
    }

    section {
      height: 100vh;              /* cada section ocupa a tela inteira */
      scroll-snap-align: start;   /* gruda no início da seção */
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 40px;
      font-size: 2rem;
    }

    #about {
      background: var(--soft-beige);
    }

    #projects {
      background: var(--blush-pink);
    }

    #contact {
      background: var(--green-moss);
      color: white;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <nav class="nav-links">
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section id="about">
    <h1>About Me</h1>
    <p>Primeira tela</p>
  </section>

  <section id="projects">
    <h1>Projects</h1>
    <p>Segunda tela</p>
  </section>

  <section id="contact">
    <h1>Contact</h1>
    <p>Terceira tela</p>
  </section>
</body>
</html>
